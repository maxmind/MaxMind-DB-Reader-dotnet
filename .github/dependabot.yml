version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "**/*"
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # The source generator pins the lowest Roslyn version that provides
    # the APIs it uses, so consumers on older SDKs can load it. Bump
    # these packages by hand.
    ignore:
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.CodeAnalysis.Analyzers
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    groups:
      codeql:
        patterns:
          - github/codeql-action*
    cooldown:
      default-days: 7
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    cooldown:
      default-days: 7
